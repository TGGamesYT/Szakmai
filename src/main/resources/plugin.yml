name: szakmai
version: '${version}'

main: dev.tggamesyt.szakmai.Szakmai
api-version: '26.2'
description: Agario-style blob game for Minecraft 26.2
author: TGdoesCode
website: https://tggamesyt.dev

commands:
  doworld:
    description: Resets the world to a fresh superflat (requires double confirm).
    usage: /doworld confirm
    permission: szakmai.doworld

permissions:
  szakmai.doworld:
    description: Allows resetting the world via /doworld confirm.
    default: op
